<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SpendLog Analytics · 分析记账</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- 登录 / 注册遮罩 -->
<div class="login-overlay" id="login-overlay">
  <div class="login-card">
    <h2 id="login-title">分析记账 · 登录</h2>
    <input id="u-name" placeholder="用户名（3-20 字符，支持中文）">
    <input id="u-pass" type="password" placeholder="密码（至少 6 位）">
    <input id="u-pass2" type="password" placeholder="确认密码" style="display:none">
    <div class="login-feedback" id="login-feedback"></div>
    <button class="btn" id="login-btn">登 录</button>
    <div class="login-toggle" id="login-toggle">首次使用？注册账号</div>
  </div>
</div>

<!-- 主界面 -->
<div class="app">
  <header>
    <div class="hdr">
      <h1>分析记账</h1>
      <div class="hdr-right">
        <span id="user-name"></span>
        <button class="hamburger" id="hamburger" aria-label="菜单">&#9776;</button>
      </div>
    </div>
  </header>

  <!-- 记账页（旧版样式 + 重构字段） -->
  <div class="card page active" id="page-add">
    <div class="label">金额（支出填负值，收入填正值）</div>
    <input id="f-amount" class="amount-input" type="number" step="0.01" placeholder="0.00">
    <div class="row" style="margin-top:16px">
      <div><input id="f-date" type="date"></div>
      <div><input id="f-time" type="time"></div>
    </div>
    <div class="label" style="margin-top:12px">场景（一级分类）</div>
    <div class="chips" id="chips-main"></div>
    <div class="addform" id="addm" style="display:none">
      <input id="m-name" placeholder="名称，如：购物">
      <button class="mini-btn" onclick="doAddMain()">添加一级</button>
    </div>
    <div class="label" style="margin-top:12px">子项（二级分类）</div>
    <div class="chips" id="chips-sub"></div>
    <div class="addform" id="adds" style="display:none">
      <input id="s-name" placeholder="名称，如：零食">
      <button class="mini-btn" onclick="doAddSub()">添加二级</button>
    </div>
    <div class="row" style="margin-top:12px">
      <div><select id="f-motive"></select></div>
      <div><select id="f-channel"></select></div>
    </div>
    <div class="addform" id="addc" style="display:none">
      <input id="c-name" placeholder="渠道名称">
      <button class="mini-btn" onclick="doAddChannel()">添加渠道</button>
    </div>
    <div class="label" style="margin-top:12px">备注</div>
    <input id="f-note" type="text" placeholder="选填">
    <button class="btn" style="margin-top:16px" onclick="submitRecord()">保存</button>
  </div>

  <!-- 报表页（仅报表 card） -->
  <div class="card page" id="page-stat">
    <div class="page-title">报表</div>
    <div class="placeholder">暂无数据<br><span class="note">报表功能将在后续阶段完善</span></div>
  </div>

  <!-- 管理页（管理员） -->
  <section class="page" id="page-admin">
    <div class="card">
      <h2>用户管理</h2>
      <div id="admin-users"></div>
    </div>
    <div class="card">
      <h2>新增账户</h2>
      <div class="pw-form">
        <input id="au-name" placeholder="用户名（3-20 字符）">
        <input id="au-pass" type="password" placeholder="初始密码（至少 6 位）">
        <button class="btn" onclick="doAddUser()">创建账户</button>
      </div>
    </div>
  </section>
</div>

<!-- 汉堡抽屉 -->
<div class="drawer-mask" id="drawer-mask"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <span id="drawer-user"></span>
    <span class="drawer-close" id="drawer-close">&#10005;</span>
  </div>
  <div id="drawer-user-sections">
    <div class="drawer-section">
      <h2>会话管理</h2>
      <p class="note">查看已登录设备，可强制下线</p>
      <div id="session-list"></div>
    </div>
    <div class="drawer-section">
      <h2>修改密码</h2>
      <div class="pw-form">
        <input id="d-old" type="password" placeholder="原密码">
        <input id="d-new" type="password" placeholder="新密码（至少 6 位）">
        <input id="d-new2" type="password" placeholder="确认新密码">
        <button class="btn" id="btn-dp-change">修改密码</button>
      </div>
    </div>
  </div>
  <div id="drawer-admin-sessions" class="drawer-section" style="display:none">
    <h2>用户会话管理</h2>
    <p class="note">按用户查看全部有效登录会话，可强制下线</p>
    <div id="admin-session-list"></div>
  </div>
  <div class="drawer-footer">
    <button class="mini-btn warn" id="btn-delete">删除账号</button>
    <button class="mini-btn danger" id="btn-logout">退出登录</button>
  </div>
</div>

<!-- 底部 Tab -->
<div class="tabbar">
  <div id="tab-add" class="active" data-page="add">记账</div>
  <div id="tab-stat" data-page="stat">报表</div>
  <div id="tab-admin" data-page="admin" style="display:none">管理</div>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
function toast(msg, ok){
  const t = $('toast');
  t.style.background = ok ? 'rgba(0,180,90,.85)' : 'rgba(0,0,0,.75)';
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.style.display='none', 1800);
}

// ---- API 封装 ----
async function api(path, opts){
  opts = opts || {};
  opts.headers = opts.headers || {};
  const token = localStorage.getItem('token');
  if(token) opts.headers['Authorization'] = 'Bearer '+token;
  const r = await fetch(path, opts);
  const j = await r.json();
  if(r.status===401 && path.indexOf('/api/auth/')!==0){
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    showLogin();
    throw new Error(j.message || '未登录或登录已过期');
  }
  if(!r.ok) throw new Error(j.message || '请求失败');
  return j;
}

function currentUser(){
  try{ return JSON.parse(localStorage.getItem('user') || 'null'); }catch(e){ return null; }
}

// ---- 底部 Tab ----
function switchPage(name){
  document.querySelectorAll('.page').forEach(s=> s.classList.toggle('active', s.id === 'page-'+name));
  document.querySelectorAll('.tabbar > div').forEach(t=> t.classList.toggle('active', t.getAttribute('data-page') === name));
  if(name === 'admin') loadAdmin();
}
document.querySelectorAll('.tabbar > div').forEach(t=>{
  t.addEventListener('click', ()=> switchPage(t.getAttribute('data-page')));
});

// ---- 登录 / 注册 ----
let authMode = 'login';
function showLogin(){ $('login-overlay').style.display='flex'; }
function hideLogin(){ $('login-overlay').style.display='none'; }
function setFeedback(msg){ $('login-feedback').textContent = msg || ''; }
function toggleAuthMode(){
  authMode = authMode === 'login' ? 'register' : 'login';
  const isReg = authMode === 'register';
  $('u-pass2').style.display = isReg ? 'block' : 'none';
  $('login-title').textContent = isReg ? '分析记账 · 注册' : '分析记账 · 登录';
  $('login-btn').textContent = isReg ? '注 册' : '登 录';
  $('login-toggle').textContent = isReg ? '已有账号？去登录' : '首次使用？注册账号';
  setFeedback('');
}
async function doAuth(){
  const username = $('u-name').value.trim();
  const password = $('u-pass').value;
  setFeedback('');
  if(!username || !password){ setFeedback('请输入用户名和密码'); return; }
  if(authMode === 'register'){
    const confirm = $('u-pass2').value;
    if(!confirm || confirm !== password){ setFeedback('两次输入的密码不一致'); return; }
    try{
      await api('/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ username, password, confirm_password: confirm }) });
      setFeedback('注册成功，请登录');
      toggleAuthMode();
    }catch(e){ setFeedback(e.message); }
    return;
  }
  try{
    const j = await api('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username, password }) });
    localStorage.setItem('token', j.data.token);
    localStorage.setItem('user', JSON.stringify(j.data.user));
    hideLogin();
    await startApp();
  }catch(e){ setFeedback(e.message); }
}
$('login-btn').addEventListener('click', doAuth);
$('login-toggle').addEventListener('click', toggleAuthMode);
// 回车键流转：用户名→密码→（注册时）确认→提交
const loginFields = ['u-name', 'u-pass', 'u-pass2'];
loginFields.forEach((id, i)=>{
  $(id).addEventListener('keydown', e=>{
    if(e.key !== 'Enter') return;
    e.preventDefault();
    if(i < loginFields.length-1 && (i < 1 || authMode==='register')){ $(loginFields[i+1]).focus(); return; }
    doAuth();
  });
});

// ---- 启动主界面 ----
async function startApp(){
  const u = currentUser();
  const isAdmin = u && u.is_admin;
  $('user-name').textContent = u ? (u.username + (isAdmin ? ' · 管理员' : '')) : '';
  hideLogin();
  $('tab-admin').style.display = isAdmin ? 'block' : 'none';
  $('tab-add').style.display = isAdmin ? 'none' : 'block';
  $('tab-stat').style.display = isAdmin ? 'none' : 'block';
  $('drawer-user-sections').style.display = isAdmin ? 'none' : 'block';
  if(isAdmin){ switchPage('admin'); return; }
  switchPage('add');
  await initAdd();
}
async function initAdd(){
  if(!S.init){
    S.init = true;
    await S.load();
  }
}

// ---- 汉堡抽屉 ----
function toggleDrawer(open){
  const d = $('drawer'), m = $('drawer-mask');
  const show = (open === undefined) ? !d.classList.contains('open') : open;
  d.classList.toggle('open', show);
  m.classList.toggle('show', show);
  document.body.style.overflow = show ? 'hidden' : '';
  if(show){
    const u = currentUser();
    $('drawer-user').textContent = u ? (u.username + (u.is_admin ? ' · 管理员' : '')) : '';
    const isAdmin = u && u.is_admin;
    $('drawer-admin-sessions').style.display = isAdmin ? 'block' : 'none';
    $('drawer-user-sections').style.display = isAdmin ? 'none' : 'block';
    if(isAdmin){ loadAdminSessions(); } else { loadSessions('session-list'); }
  }
}
$('hamburger').addEventListener('click', ()=> toggleDrawer());
$('drawer-close').addEventListener('click', ()=> toggleDrawer(false));
$('drawer-mask').addEventListener('click', ()=> toggleDrawer(false));

// ---- 退出 ----
async function doLogout(){
  toggleDrawer(false);
  try{ await api('/api/auth/logout', { method:'POST' }); }catch(e){}
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  showLogin();
}
$('btn-logout').addEventListener('click', doLogout);

// ---- 修改密码（抽屉）----
$('btn-dp-change').addEventListener('click', async ()=>{
  const old = $('d-old').value;
  const n1 = $('d-new').value;
  const n2 = $('d-new2').value;
  if(!old){ toast('请输入原密码'); return; }
  if(!n1 || n1.length < 6){ toast('新密码至少 6 位'); return; }
  if(n1 !== n2){ toast('两次新密码不一致'); return; }
  try{
    await api('/api/auth/password', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ old_password: old, new_password: n1 }) });
    $('d-old').value=''; $('d-new').value=''; $('d-new2').value='';
    toast('密码已修改', true);
  }catch(e){ toast(e.message); }
});

// ---- 删除账号（需二次确认；管理员无此入口）----
$('btn-delete').addEventListener('click', async ()=>{
  const u = currentUser();
  if(u && u.is_admin) return;
  if(!confirm('确定删除你的账号？此操作将永久删除该账号及其全部记账数据，且不可恢复。')) return;
  if(!confirm('二次确认：删除后无法找回，确定永久删除？')) return;
  try{
    await api('/api/auth/delete', { method:'DELETE' });
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    showLogin();
    toast('账号已删除', true);
  }catch(e){ toast(e.message); }
});

// ---- 会话管理 ----
function deviceLabel(ua){
  ua = ua || '';
  const name =
    /MicroMessenger/i.test(ua) ? '微信内置浏览器' :
    /iPhone|iPad|iPod/i.test(ua) ? 'iOS 设备' :
    /Android/i.test(ua) ? 'Android 设备' :
    /Edg/i.test(ua) ? 'Edge' :
    /Firefox/i.test(ua) ? 'Firefox' :
    /Chrome/i.test(ua) ? 'Chrome' :
    /Safari/i.test(ua) ? 'Safari' : '';
  return name || (ua.slice(0, 40) || '未知设备');
}
function fmtTime(s){
  return s ? s.slice(0, 16).replace('T', ' ') : '';
}
async function loadSessions(boxId){
  const box = $(boxId);
  if(!box) return;
  let list = [];
  try{
    const j = await api('/api/sessions');
    list = j.data || [];
  }catch(e){
    box.innerHTML = '<span class="note">读取失败</span>';
    return;
  }
  if(!list.length){ box.innerHTML = '<span class="note">当前无有效登录会话</span>'; return; }
  box.innerHTML = '';
  list.forEach(s=>{
    const dev = (s.user_agent ? deviceLabel(s.user_agent) : '未知设备') + ' · ' + s.token.slice(0, 8) + '…';
    const row = document.createElement('div');
    row.className = 'user-row';
    row.innerHTML = `
      <div class="u-name">${dev}${s.is_current ? '<span class="tag">当前</span>' : ''}</div>
      <div class="u-meta">登录 ${fmtTime(s.created_at)} · 过期 ${fmtTime(s.expires_at)}</div>
      <div class="u-actions">
        ${s.is_current
          ? '<button class="mini-btn" disabled style="opacity:.4">当前使用</button>'
          : `<button class="mini-btn danger" onclick="revokeSession('${boxId}','${s.token}')">强制下线</button>`}
      </div>`;
    box.appendChild(row);
  });
}
async function revokeSession(boxId, token){
  if(!confirm('确定强制下线该设备？')) return;
  try{
    await api('/api/sessions/revoke', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token }) });
    toast('已强制下线', true);
    loadSessions(boxId);
  }catch(e){ toast(e.message); }
}

// ---- 管理员（复用旧版管理页）----
function fmtKb(n){
  n = n || 0;
  if(n < 1024) return n + ' B';
  return (n / 1024).toFixed(1) + ' KB';
}
async function loadAdmin(){
  try{
    const j = await api('/api/admin/users');
    renderUsers(j.data);
    loadAdminSessions();
  }catch(e){ toast(e.message); }
}
function loadAdminSessions(){
  const box = $('admin-session-list');
  if(!box) return;
  const curToken = localStorage.getItem('token');
  api('/api/admin/sessions').then(j=>{
    const groups = j.data || [];
    if(!groups.length){ box.innerHTML = '<span class="note">当前无有效登录会话</span>'; return; }
    box.innerHTML = '';
    groups.forEach(g=>{
      const head = document.createElement('div');
      head.className = 'u-name';
      head.style.marginTop = '10px';
      head.textContent = g.username + (g.user_id === 0 ? '（管理员）' : '');
      box.appendChild(head);
      g.sessions.forEach(s=>{
        const isCur = s.token === curToken;
        const dev = (s.user_agent ? deviceLabel(s.user_agent) : '设备') + ' · ' + s.token.slice(0, 8) + '…';
        const created = s.created_at ? s.created_at.slice(0, 16) : '';
        const expires = s.expires_at ? s.expires_at.slice(0, 16) : '';
        const row = document.createElement('div');
        row.className = 'user-row';
        row.innerHTML = `
          <div class="u-name">${dev}${isCur ? '<span class="tag">当前</span>' : ''}</div>
          <div class="u-meta">登录 ${created} · 过期 ${expires}</div>
          <div class="u-actions">
            ${isCur ? '<button class="mini-btn" disabled style="opacity:.4">当前使用</button>'
                    : `<button class="mini-btn danger" onclick="forceLogoutAdmin('${s.token}')">强制下线</button>`}
          </div>`;
        box.appendChild(row);
      });
    });
  }).catch(()=>{ box.innerHTML = '<span class="note">读取失败</span>'; });
}
async function forceLogoutAdmin(token){
  if(!confirm('确定强制下线该会话？')) return;
  try{
    await api('/api/admin/sessions/revoke', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token }) });
    toast('已强制下线', true);
    loadAdminSessions();
  }catch(e){ toast(e.message); }
}
async function renderUsers(users){
  const box = $('admin-users');
  box.innerHTML = '';
  if(!users.length){ box.innerHTML = '<span class="note">暂无用户</span>'; return; }
  users.forEach(u=>{
    const created = (u.created_at || '').slice(0, 10);
    const dbSize = u.db_size ? (' · 数据 ' + fmtKb(u.db_size)) : '';
    const meta = `注册 ${created} · ${u.record_count} 条记录${dbSize}`;
    const row = document.createElement('div');
    row.className = 'user-row';
    row.innerHTML = `
      <div class="u-name">${u.username}${u.is_admin ? '<span class="tag">管理员</span>' : ''}${u.is_active ? '' : '<span class="tag on">已禁用</span>'}</div>
      <div class="u-meta">${meta}</div>
      ${u.is_admin ? '' : `
        <div class="u-actions">
          <button class="mini-btn" onclick="toggleResetForm(${u.id})">重置密码</button>
          <button class="mini-btn ${u.is_active ? 'warn' : ''}" onclick="toggleUser(${u.id}, ${u.is_active ? 'true' : 'false'})">${u.is_active ? '禁用' : '启用'}</button>
          <button class="mini-btn danger" onclick="delUser(${u.id})">删除</button>
        </div>
        <div class="reset-form" id="reset-${u.id}" style="display:none">
          <input type="password" id="rp-${u.id}" placeholder="新密码（至少 6 位）">
          <button class="mini-btn" onclick="doReset(${u.id})">确认重置</button>
        </div>`}
    `;
    box.appendChild(row);
  });
}
function toggleResetForm(id){
  const f = $('reset-'+id);
  const show = f.style.display !== 'flex';
  f.style.display = show ? 'flex' : 'none';
  if(!show) $('rp-'+id).value = '';
}
async function doReset(id){
  const pw = $('rp-'+id).value;
  if(!pw || pw.length < 6){ toast('新密码至少 6 位'); return; }
  try{
    await api('/api/admin/users/reset_password', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ user_id: id, new_password: pw }) });
    $('reset-'+id).style.display = 'none';
    toast('已重置，该用户需重新登录', true);
  }catch(e){ toast(e.message); }
}
async function toggleUser(id, disable){
  if(!confirm((disable ? '禁用' : '启用') + '该用户？')) return;
  try{
    await api('/api/admin/users/' + (disable ? 'disable' : 'enable'), { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ user_id: id }) });
    toast(disable ? '已禁用' : '已启用', true);
    loadAdmin();
  }catch(e){ toast(e.message); }
}
async function delUser(id){
  if(!confirm('删除该用户将清空其全部记账数据，且不可恢复。确定？')) return;
  try{
    await api('/api/admin/users?user_id=' + id, { method:'DELETE' });
    toast('已删除', true);
    loadAdmin();
  }catch(e){ toast(e.message); }
}
async function doAddUser(){
  const name = $('au-name').value.trim();
  const pass = $('au-pass').value;
  if(!name || name.length < 3 || name.length > 20){ toast('用户名需 3-20 个字符'); return; }
  if(!pass || pass.length < 6){ toast('初始密码至少 6 位'); return; }
  try{
    await api('/api/admin/users/create', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: name, password: pass }) });
    $('au-name').value=''; $('au-pass').value='';
    toast('已创建账户', true);
    loadAdmin();
  }catch(e){ toast(e.message); }
}

// ---- 记账页：一级/二级分类 + 消费场景 + 渠道 ----
const S = { categories: [], init: false };
let curMain = null;

S.load = async function(){
  await Promise.allSettled([loadCategories(), loadDict()]);
  if(!$('f-amount').value) $('f-amount').value = '0.00'; // 金额默认当前
  if(!$('f-date').value) $('f-date').value = todayStr();   // 日期默认今天
  if(!$('f-time').value) $('f-time').value = nowTimeStr();  // 时间默认当前
};

function todayStr(){
  const d = new Date();
  const p = n => (n < 10 ? '0' : '') + n;
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function nowTimeStr(){
  const d = new Date();
  const p = n => (n < 10 ? '0' : '') + n;
  return `${p(d.getHours())}:${p(d.getMinutes())}`;
}
function mainOf(id){ return S.categories.find(c => c.id === id); }
function findCat(id, arr){
  if(arr === undefined) arr = S.categories;
  for(const n of arr){
    if(n.id === id) return n;
    const r = findCat(id, n.children);
    if(r) return r;
  }
  return null;
}
async function loadCategories(){
  const j = await api('/api/categories');
  S.categories = j.data || [];
  renderMainChips();
}
function renderMainChips(){
  const box = $('chips-main');
  box.innerHTML = '';
  S.categories.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.dataset.id = c.id;
    chip.dataset.used = c.used ? '1' : '0';
    chip.textContent = c.name;
    bindChipDelete(chip);
    box.appendChild(chip);
  });
  addAddChip(box, 'addm');
  if(S.categories.length && !mainOf(curMain)) selectMain(S.categories[0].id);
  else selectMain(curMain);
}
function selectMain(id){
  curMain = id;
  document.querySelectorAll('#chips-main .chip').forEach(ch=>{
    ch.classList.toggle('active', Number(ch.dataset.id) === id);
  });
  renderSubChips(id);
}
function renderSubChips(id){
  const m = mainOf(id);
  const box = $('chips-sub');
  box.innerHTML = '';
  if(!m) return;
  m.children.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = c.name;
    chip.dataset.id = c.id;
    chip.dataset.used = c.used ? '1' : '0';
    bindChipDelete(chip);
    box.appendChild(chip);
  });
  addAddChip(box, 'adds');
  setTimeout(()=>{ if(box.firstChild) box.firstChild.classList.add('active'); }, 0);
}

// 固定的「+新增」标签：虚线外框，不可拖动，固定最后一位
function addAddChip(box, formId){
  const add = document.createElement('div');
  add.className = 'chip add-chip';
  add.textContent = '+新增';
  add.onclick = ()=> toggleSide(box, formId);
  box.appendChild(add);
}
function toggleSide(box, formId){
  const f = $(formId);
  const open = f.style.display === 'none';
  f.style.display = open ? 'flex' : 'none';
  box.querySelector('.chip.add-chip').classList.toggle('active', open);
}

// ---- 记一笔页内联新增分类 ----
async function doAddMain(){
  const name = $('m-name').value.trim();
  if(!name){ toast('请输入名称'); return; }
  try{
    await api('/api/categories', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name }) });
    $('m-name').value=''; $('addm').style.display='none';
    await loadCategories();
    toast('已添加一级分类', true);
  }catch(e){ toast(e.message); }
}
async function doAddSub(){
  if(!curMain){ toast('请先选择一级分类'); return; }
  const name = $('s-name').value.trim();
  if(!name){ toast('请输入名称'); return; }
  try{
    await api('/api/categories', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name, parent_id: curMain }) });
    $('s-name').value=''; $('adds').style.display='none';
    await loadCategories();
    selectMain(curMain);
    toast('已添加二级分类', true);
  }catch(e){ toast(e.message); }
}

// ---- 分类标签长按 / 右键删除（红=可删 灰=被用不可删）----
let delTimer = null;
function closeDelMark(){ document.querySelectorAll('.del-mark.show').forEach(m=>m.classList.remove('show')); }
function showDelMark(chip){
  closeDelMark();
  if(window.getSelection && window.getSelection().removeAllRanges) window.getSelection().removeAllRanges();
  const mark = chip.querySelector('.del-mark');
  if(!mark) return;
  mark.classList.toggle('red', chip.dataset.used !== '1');
  mark.classList.toggle('gray', chip.dataset.used === '1');
  mark.classList.add('show');
}
function bindChipDelete(chip){
  chip.addEventListener('touchstart', ()=>{
    delTimer = setTimeout(()=> showDelMark(chip), 500);
  }, { passive: true });
  ['touchend','touchmove','touchcancel'].forEach(ev=>{
    chip.addEventListener(ev, ()=> clearTimeout(delTimer), { passive: true });
  });
  chip.addEventListener('contextmenu', e=>{ e.preventDefault(); showDelMark(chip); });
  const mark = document.createElement('span');
  mark.className = 'del-mark';
  mark.innerHTML = '✕';
  mark.onclick = e=>{
    e.stopPropagation();
    delChip(Number(chip.dataset.id), chip.dataset.used === '1');
  };
  chip.appendChild(mark);
}
async function delChip(id, used){
  if(used){ toast('该分类已被记账使用，无法删除'); return; }
  try{
    await api('/api/categories?id=' + id, { method:'DELETE' });
    if(curMain === id) curMain = S.categories.length ? S.categories[0].id : null;
    await loadCategories();
    toast('已删除', true);
  }catch(e){ toast(e.message); }
}

// ---- 分类标签拖动排序 ----
let drag = null;
function enableChipDrag(box, isMain){
  box.addEventListener('pointerdown', e=>{
    if(e.button !== undefined && e.button !== 0) return;
    const chip = e.target.closest ? e.target.closest('.chip') : null;
    if(!chip || chip.classList.contains('drag-marker') || chip.classList.contains('add-chip')) return;
    if(e.target.classList.contains('del-mark')) return;
    closeDelMark();
    drag = { box, chip, isMain, id: e.pointerId, started: false, sx: e.clientX, sy: e.clientY };
    if(box.setPointerCapture){ try{ box.setPointerCapture(e.pointerId); }catch(err){} }
  });
  box.addEventListener('pointermove', e=>{
    if(!drag || drag.box !== box || e.pointerId !== drag.id) return;
    if(!drag.started){
      if(Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6) return;
      startGhost(e);
    }
    drag.chip.style.transform = `translate(${e.clientX - drag.grabDX}px, ${e.clientY - drag.grabDY}px)`;
    relocateMarker(e);
  });
  const end = e=>{
    const d = drag;
    if(!d || d.box !== box || e.pointerId !== d.id) return;
    const wasMoved = d.started;
    finishDrag(e);
    if(!wasMoved) selectChip(d.box, d.chip); // 未拖动=点击，用于选中
  };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
}
// pointer capture 会把 click 重定向到容器，故选择放在 pointerup：未发生拖动即选中
function selectChip(box, chip){
  const id = Number(chip.dataset.id);
  if(!id) return;
  if(box.id === 'chips-main') selectMain(id);
  else if(box.id === 'chips-sub'){
    document.querySelectorAll('#chips-sub .chip').forEach(x=>x.classList.remove('active'));
    chip.classList.add('active');
  }
}
function startGhost(e){
  const d = drag;
  d.started = true;
  if(delTimer) clearTimeout(delTimer);
  closeDelMark();
  const r = d.chip.getBoundingClientRect();
  d.grabDX = e.clientX - r.left;
  d.grabDY = e.clientY - r.top;
  d.marker = document.createElement('div');
  d.marker.className = 'chip drag-marker';
  d.chip.insertAdjacentElement('beforebegin', d.marker);
  d.chip.style.cssText = 'position:fixed;left:0;top:0;z-index:99;pointer-events:none;opacity:.85;'
    + 'box-shadow:0 6px 18px rgba(0,0,0,.18);transition:none;'
    + `transform:translate(${e.clientX - d.grabDX}px, ${e.clientY - d.grabDY}px)`;
}
function relocateMarker(e){
  const d = drag;
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const target = under && under.closest ? under.closest('.chip') : null;
  if(!target || target === d.chip || target === d.marker) return;
  const r = target.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const before = (Math.abs(e.clientY - cy) <= r.height/2) ? (e.clientX < cx) : (e.clientY < cy);
  d.box.insertBefore(d.marker, before ? target : target.nextSibling);
}
function finishDrag(e){
  const d = drag;
  drag = null;
  if(!d.started) return;
  const chip = d.chip, marker = d.marker;
  chip.style.cssText = '';
  d.box.insertBefore(chip, marker);
  marker.remove();
  const addChip = d.box.querySelector('.chip.add-chip');
  if(addChip) d.box.appendChild(addChip); // 保证「+新增」始终在最后一位
  const ids = Array.from(d.box.querySelectorAll('.chip:not(.add-chip)')).map(c=> Number(c.dataset.id));
  persistOrder(d.isMain, ids);
}
async function persistOrder(isMain, ids){
  const body = isMain ? { ids } : { ids, parent_id: curMain };
  try{
    await api('/api/categories/reorder', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body) });
    await loadCategories();
  }catch(err){ toast(err.message); await loadCategories(); }
}
enableChipDrag($('chips-main'), true);
enableChipDrag($('chips-sub'), false);

// ---- 消费场景 & 渠道字典 ----
let motivesLoaded = false, channelsLoaded = false;
function fmtAmount(v){
  v = Number(v || 0);
  return (v > 0 ? '+' : '') + v.toFixed(2);
}
async function loadDict(){
  if(!motivesLoaded){
    try{
      const j = await api('/api/motives');
      const sel = $('f-motive'); sel.innerHTML = '';
      (j.data || []).forEach(m=>{
        const o = document.createElement('option');
        o.value = m.id; o.textContent = m.name;
        sel.appendChild(o);
      });
      if(j.data && j.data.length) sel.value = j.data[0].id; // 默认「独自消费」
      motivesLoaded = true;
    }catch(e){ toast(e.message); }
  }
  if(!channelsLoaded){
    try{
      const j = await api('/api/channels');
      const sel = $('f-channel');
      const keep = sel.value;
      sel.innerHTML = '';
      (j.data || []).forEach(c=>{
        const o = document.createElement('option');
        o.value = c.id; o.textContent = c.name + '（' + fmtAmount(c.balance) + '）';
        sel.appendChild(o);
      });
      if(!keep){
        sel.value = j.last_used_channel_id || (j.data && j.data[0] && j.data[0].id) || '';
      }
      // 底部「新建渠道」选项，选中后展开内联输入
      if(![...sel.options].some(o=> o.value === '__new__')){
        const n = document.createElement('option');
        n.value = '__new__'; n.textContent = '＋ 新建渠道';
        sel.appendChild(n);
      }
      channelsLoaded = true;
    }catch(e){ toast(e.message); }
  }
}
// 渠道下拉选中「＋新建渠道」时展开内联输入
$('f-channel').addEventListener('change', ()=>{
  const sel = $('f-channel');
  if(sel.value === '__new__'){
    sel.dataset.prev = sel.dataset.prev || '';
    sel.dataset.prev = sel.options[sel.selectedIndex-1] ? sel.options[sel.selectedIndex-1].value : '';
    $('addc').style.display = 'flex';
    sel.value = sel.dataset.prev;
    $('c-name').focus();
  }
});

// ---- 新建渠道 ----
async function doAddChannel(){
  const name = $('c-name').value.trim();
  if(!name){ toast('请输入渠道名称'); return; }
  try{
    const j = await api('/api/channels', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name }) });
    $('c-name').value=''; $('addc').style.display='none';
    channelsLoaded = false;
    await loadDict();
    $('f-channel').value = j.data.id;
    toast('已添加渠道', true);
  }catch(e){ toast(e.message); }
}

// ---- 保存 ----
async function submitRecord(){
  const amount = parseFloat($('f-amount').value);
  if(isNaN(amount) || amount === 0){ toast('请输入有效金额'); return; }
  const selSub = document.querySelector('#chips-sub .chip.active');
  if(!selSub || !selSub.dataset.id){ toast('请选择二级分类'); return; }
  const date = $('f-date').value;
  if(!date){ toast('请选择日期'); return; }
  const payload = {
    date,
    time: $('f-time').value || '',
    amount,
    category_id: Number(selSub.dataset.id),
    motive_id: Number($('f-motive').value),
    channel_id: Number($('f-channel').value),
    note: $('f-note').value.trim()
  };
  try{
    await api('/api/records', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload) });
    $('f-amount').value=''; $('f-note').value='';
    channelsLoaded = false; loadDict(); // 刷新渠道余额显示与「记住上一次渠道」
    toast('已保存', true);
  }catch(e){ toast(e.message); }
}

// ---- 初始化 ----
(async function initAuth(){
  const u = currentUser();
  if(!localStorage.getItem('token') || !u){ showLogin(); return; }
  // 有凭证则立即进入主界面（避免刷新时闪登录页），后台校验有效性
  startApp();
  try{
    const me = await api('/api/auth/me');
    localStorage.setItem('user', JSON.stringify(me.data));
  }catch(e){
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    showLogin();
  }
})();

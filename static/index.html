<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SpendLog Analytics · 分析记账</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- 登录 / 注册遮罩 -->
<div class="login-overlay" id="login-overlay">
  <div class="login-card">
    <h2 id="login-title">分析记账 · 登录</h2>
    <input id="u-name" placeholder="用户名（3-20 字符，支持中文）">
    <input id="u-pass" type="password" placeholder="密码（至少 6 位）">
    <input id="u-pass2" type="password" placeholder="确认密码" style="display:none">
    <div class="login-feedback" id="login-feedback"></div>
    <button class="btn" id="login-btn">登 录</button>
    <div class="login-toggle" id="login-toggle">首次使用？注册账号</div>
  </div>
</div>

<!-- 主界面 -->
<div class="app">
  <header>
    <div class="hdr">
      <h1>分析记账</h1>
      <div class="hdr-right">
        <span id="user-name"></span>
        <button class="hamburger" id="hamburger" aria-label="菜单">&#9776;</button>
      </div>
    </div>
  </header>

  <!-- 记账页（仅记账 card） -->
  <div class="card page active" id="page-add">
    <div class="page-title">记账</div>
    <div class="field">
      <label>场景</label>
      <select id="scene-select"></select>
    </div>
    <div class="chips" id="sub-chips"></div>
    <div class="sel-hint" id="sel-hint"></div>
  </div>

  <!-- 报表页（仅报表 card） -->
  <div class="card page" id="page-stat">
    <div class="page-title">报表</div>
    <div class="placeholder">暂无数据<br><span class="note">报表功能将在后续阶段完善</span></div>
  </div>

  <!-- 管理页（管理员） -->
  <section class="page" id="page-admin">
    <div class="card">
      <h2>用户管理</h2>
      <div id="admin-users"></div>
    </div>
    <div class="card">
      <h2>新增账户</h2>
      <div class="pw-form">
        <input id="au-name" placeholder="用户名（3-20 字符）">
        <input id="au-pass" type="password" placeholder="初始密码（至少 6 位）">
        <button class="btn" onclick="doAddUser()">创建账户</button>
      </div>
    </div>
  </section>
</div>

<!-- 汉堡抽屉 -->
<div class="drawer-mask" id="drawer-mask"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <span id="drawer-user"></span>
    <span class="drawer-close" id="drawer-close">&#10005;</span>
  </div>
  <div id="drawer-user-sections">
    <div class="drawer-section">
      <h2>会话管理</h2>
      <p class="note">查看已登录设备，可强制下线</p>
      <div id="session-list"></div>
    </div>
    <div class="drawer-section">
      <h2>修改密码</h2>
      <div class="pw-form">
        <input id="d-old" type="password" placeholder="原密码">
        <input id="d-new" type="password" placeholder="新密码（至少 6 位）">
        <input id="d-new2" type="password" placeholder="确认新密码">
        <button class="btn" id="btn-dp-change">修改密码</button>
      </div>
    </div>
  </div>
  <div id="drawer-admin-sessions" class="drawer-section" style="display:none">
    <h2>用户会话管理</h2>
    <p class="note">按用户查看全部有效登录会话，可强制下线</p>
    <div id="admin-session-list"></div>
  </div>
  <div class="drawer-footer">
    <button class="mini-btn warn" id="btn-delete">删除账号</button>
    <button class="mini-btn danger" id="btn-logout">退出登录</button>
  </div>
</div>

<!-- 底部 Tab -->
<div class="tabbar">
  <div id="tab-add" class="active" data-page="add">记账</div>
  <div id="tab-stat" data-page="stat">报表</div>
  <div id="tab-admin" data-page="admin" style="display:none">管理</div>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
function toast(msg, ok){
  const t = $('toast');
  t.style.background = ok ? 'rgba(0,180,90,.85)' : 'rgba(0,0,0,.75)';
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.style.display='none', 1800);
}

// ---- API 封装 ----
async function api(path, opts){
  opts = opts || {};
  opts.headers = opts.headers || {};
  const token = localStorage.getItem('token');
  if(token) opts.headers['Authorization'] = 'Bearer '+token;
  const r = await fetch(path, opts);
  const j = await r.json();
  if(r.status===401 && path.indexOf('/api/auth/')!==0){
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    showLogin();
    throw new Error(j.message || '未登录或登录已过期');
  }
  if(!r.ok) throw new Error(j.message || '请求失败');
  return j;
}

function currentUser(){
  try{ return JSON.parse(localStorage.getItem('user') || 'null'); }catch(e){ return null; }
}

// ---- 底部 Tab ----
function switchPage(name){
  document.querySelectorAll('.page').forEach(s=> s.classList.toggle('active', s.id === 'page-'+name));
  document.querySelectorAll('.tabbar > div').forEach(t=> t.classList.toggle('active', t.getAttribute('data-page') === name));
  if(name === 'admin') loadAdmin();
}
document.querySelectorAll('.tabbar > div').forEach(t=>{
  t.addEventListener('click', ()=> switchPage(t.getAttribute('data-page')));
});

// ---- 登录 / 注册 ----
let authMode = 'login';
function showLogin(){ $('login-overlay').style.display='flex'; }
function hideLogin(){ $('login-overlay').style.display='none'; }
function setFeedback(msg){ $('login-feedback').textContent = msg || ''; }
function toggleAuthMode(){
  authMode = authMode === 'login' ? 'register' : 'login';
  const isReg = authMode === 'register';
  $('u-pass2').style.display = isReg ? 'block' : 'none';
  $('login-title').textContent = isReg ? '分析记账 · 注册' : '分析记账 · 登录';
  $('login-btn').textContent = isReg ? '注 册' : '登 录';
  $('login-toggle').textContent = isReg ? '已有账号？去登录' : '首次使用？注册账号';
  setFeedback('');
}
async function doAuth(){
  const username = $('u-name').value.trim();
  const password = $('u-pass').value;
  setFeedback('');
  if(!username || !password){ setFeedback('请输入用户名和密码'); return; }
  if(authMode === 'register'){
    const confirm = $('u-pass2').value;
    if(!confirm || confirm !== password){ setFeedback('两次输入的密码不一致'); return; }
    try{
      await api('/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ username, password, confirm_password: confirm }) });
      setFeedback('注册成功，请登录');
      toggleAuthMode();
    }catch(e){ setFeedback(e.message); }
    return;
  }
  try{
    const j = await api('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username, password }) });
    localStorage.setItem('token', j.data.token);
    localStorage.setItem('user', JSON.stringify(j.data.user));
    hideLogin();
    await startApp();
  }catch(e){ setFeedback(e.message); }
}
$('login-btn').addEventListener('click', doAuth);
$('login-toggle').addEventListener('click', toggleAuthMode);
// 回车键流转：用户名→密码→（注册时）确认→提交
const loginFields = ['u-name', 'u-pass', 'u-pass2'];
loginFields.forEach((id, i)=>{
  $(id).addEventListener('keydown', e=>{
    if(e.key !== 'Enter') return;
    e.preventDefault();
    if(i < loginFields.length-1 && (i < 1 || authMode==='register')){ $(loginFields[i+1]).focus(); return; }
    doAuth();
  });
});

// ---- 启动主界面 ----
async function startApp(){
  const u = currentUser();
  const isAdmin = u && u.is_admin;
  $('user-name').textContent = u ? (u.username + (isAdmin ? ' · 管理员' : '')) : '';
  hideLogin();
  $('tab-admin').style.display = isAdmin ? 'block' : 'none';
  $('tab-add').style.display = isAdmin ? 'none' : 'block';
  $('tab-stat').style.display = isAdmin ? 'none' : 'block';
  $('drawer-user-sections').style.display = isAdmin ? 'none' : 'block';
  if(isAdmin){ switchPage('admin'); return; }
  switchPage('add');
  // 加载分类树并渲染场景三级联动（记账页默认页）
  if(S.categories.length === 0){
    try{ await fetchCategories(); }catch(e){ toast(e.message); }
  }
  renderSceneSelect();
}

// ---- 汉堡抽屉 ----
function toggleDrawer(open){
  const d = $('drawer'), m = $('drawer-mask');
  const show = (open === undefined) ? !d.classList.contains('open') : open;
  d.classList.toggle('open', show);
  m.classList.toggle('show', show);
  document.body.style.overflow = show ? 'hidden' : '';
  if(show){
    const u = currentUser();
    $('drawer-user').textContent = u ? (u.username + (u.is_admin ? ' · 管理员' : '')) : '';
    const isAdmin = u && u.is_admin;
    $('drawer-admin-sessions').style.display = isAdmin ? 'block' : 'none';
    $('drawer-user-sections').style.display = isAdmin ? 'none' : 'block';
    if(isAdmin){ loadAdminSessions(); } else { loadSessions('session-list'); }
  }
}
$('hamburger').addEventListener('click', ()=> toggleDrawer());
$('drawer-close').addEventListener('click', ()=> toggleDrawer(false));
$('drawer-mask').addEventListener('click', ()=> toggleDrawer(false));

// ---- 退出 ----
async function doLogout(){
  toggleDrawer(false);
  try{ await api('/api/auth/logout', { method:'POST' }); }catch(e){}
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  showLogin();
}
$('btn-logout').addEventListener('click', doLogout);

// ---- 修改密码（抽屉）----
$('btn-dp-change').addEventListener('click', async ()=>{
  const old = $('d-old').value;
  const n1 = $('d-new').value;
  const n2 = $('d-new2').value;
  if(!old){ toast('请输入原密码'); return; }
  if(!n1 || n1.length < 6){ toast('新密码至少 6 位'); return; }
  if(n1 !== n2){ toast('两次新密码不一致'); return; }
  try{
    await api('/api/auth/password', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ old_password: old, new_password: n1 }) });
    $('d-old').value=''; $('d-new').value=''; $('d-new2').value='';
    toast('密码已修改', true);
  }catch(e){ toast(e.message); }
});

// ---- 删除账号（需二次确认；管理员无此入口）----
$('btn-delete').addEventListener('click', async ()=>{
  const u = currentUser();
  if(u && u.is_admin) return;
  if(!confirm('确定删除你的账号？此操作将永久删除该账号及其全部记账数据，且不可恢复。')) return;
  if(!confirm('二次确认：删除后无法找回，确定永久删除？')) return;
  try{
    await api('/api/auth/delete', { method:'DELETE' });
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    showLogin();
    toast('账号已删除', true);
  }catch(e){ toast(e.message); }
});

// ---- 会话管理 ----
function deviceLabel(ua){
  ua = ua || '';
  const name =
    /MicroMessenger/i.test(ua) ? '微信内置浏览器' :
    /iPhone|iPad|iPod/i.test(ua) ? 'iOS 设备' :
    /Android/i.test(ua) ? 'Android 设备' :
    /Edg/i.test(ua) ? 'Edge' :
    /Firefox/i.test(ua) ? 'Firefox' :
    /Chrome/i.test(ua) ? 'Chrome' :
    /Safari/i.test(ua) ? 'Safari' : '';
  return name || (ua.slice(0, 40) || '未知设备');
}
function fmtTime(s){
  return s ? s.slice(0, 16).replace('T', ' ') : '';
}
async function loadSessions(boxId){
  const box = $(boxId);
  if(!box) return;
  let list = [];
  try{
    const j = await api('/api/sessions');
    list = j.data || [];
  }catch(e){
    box.innerHTML = '<span class="note">读取失败</span>';
    return;
  }
  if(!list.length){ box.innerHTML = '<span class="note">当前无有效登录会话</span>'; return; }
  box.innerHTML = '';
  list.forEach(s=>{
    const dev = (s.user_agent ? deviceLabel(s.user_agent) : '未知设备') + ' · ' + s.token.slice(0, 8) + '…';
    const row = document.createElement('div');
    row.className = 'user-row';
    row.innerHTML = `
      <div class="u-name">${dev}${s.is_current ? '<span class="tag">当前</span>' : ''}</div>
      <div class="u-meta">登录 ${fmtTime(s.created_at)} · 过期 ${fmtTime(s.expires_at)}</div>
      <div class="u-actions">
        ${s.is_current
          ? '<button class="mini-btn" disabled style="opacity:.4">当前使用</button>'
          : `<button class="mini-btn danger" onclick="revokeSession('${boxId}','${s.token}')">强制下线</button>`}
      </div>`;
    box.appendChild(row);
  });
}
async function revokeSession(boxId, token){
  if(!confirm('确定强制下线该设备？')) return;
  try{
    await api('/api/sessions/revoke', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token }) });
    toast('已强制下线', true);
    loadSessions(boxId);
  }catch(e){ toast(e.message); }
}

// ---- 管理员（复用旧版管理页）----
function fmtKb(n){
  n = n || 0;
  if(n < 1024) return n + ' B';
  return (n / 1024).toFixed(1) + ' KB';
}
async function loadAdmin(){
  try{
    const j = await api('/api/admin/users');
    renderUsers(j.data);
    loadAdminSessions();
  }catch(e){ toast(e.message); }
}
function loadAdminSessions(){
  const box = $('admin-session-list');
  if(!box) return;
  const curToken = localStorage.getItem('token');
  api('/api/admin/sessions').then(j=>{
    const groups = j.data || [];
    if(!groups.length){ box.innerHTML = '<span class="note">当前无有效登录会话</span>'; return; }
    box.innerHTML = '';
    groups.forEach(g=>{
      const head = document.createElement('div');
      head.className = 'u-name';
      head.style.marginTop = '10px';
      head.textContent = g.username + (g.user_id === 0 ? '（管理员）' : '');
      box.appendChild(head);
      g.sessions.forEach(s=>{
        const isCur = s.token === curToken;
        const dev = (s.user_agent ? deviceLabel(s.user_agent) : '设备') + ' · ' + s.token.slice(0, 8) + '…';
        const created = s.created_at ? s.created_at.slice(0, 16) : '';
        const expires = s.expires_at ? s.expires_at.slice(0, 16) : '';
        const row = document.createElement('div');
        row.className = 'user-row';
        row.innerHTML = `
          <div class="u-name">${dev}${isCur ? '<span class="tag">当前</span>' : ''}</div>
          <div class="u-meta">登录 ${created} · 过期 ${expires}</div>
          <div class="u-actions">
            ${isCur ? '<button class="mini-btn" disabled style="opacity:.4">当前使用</button>'
                    : `<button class="mini-btn danger" onclick="forceLogoutAdmin('${s.token}')">强制下线</button>`}
          </div>`;
        box.appendChild(row);
      });
    });
  }).catch(()=>{ box.innerHTML = '<span class="note">读取失败</span>'; });
}
async function forceLogoutAdmin(token){
  if(!confirm('确定强制下线该会话？')) return;
  try{
    await api('/api/admin/sessions/revoke', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token }) });
    toast('已强制下线', true);
    loadAdminSessions();
  }catch(e){ toast(e.message); }
}
async function renderUsers(users){
  const box = $('admin-users');
  box.innerHTML = '';
  if(!users.length){ box.innerHTML = '<span class="note">暂无用户</span>'; return; }
  users.forEach(u=>{
    const created = (u.created_at || '').slice(0, 10);
    const dbSize = u.db_size ? (' · 数据 ' + fmtKb(u.db_size)) : '';
    const meta = `注册 ${created} · ${u.record_count} 条记录${dbSize}`;
    const row = document.createElement('div');
    row.className = 'user-row';
    row.innerHTML = `
      <div class="u-name">${u.username}${u.is_admin ? '<span class="tag">管理员</span>' : ''}${u.is_active ? '' : '<span class="tag on">已禁用</span>'}</div>
      <div class="u-meta">${meta}</div>
      ${u.is_admin ? '' : `
        <div class="u-actions">
          <button class="mini-btn" onclick="toggleResetForm(${u.id})">重置密码</button>
          <button class="mini-btn ${u.is_active ? 'warn' : ''}" onclick="toggleUser(${u.id}, ${u.is_active ? 'true' : 'false'})">${u.is_active ? '禁用' : '启用'}</button>
          <button class="mini-btn danger" onclick="delUser(${u.id})">删除</button>
        </div>
        <div class="reset-form" id="reset-${u.id}" style="display:none">
          <input type="password" id="rp-${u.id}" placeholder="新密码（至少 6 位）">
          <button class="mini-btn" onclick="doReset(${u.id})">确认重置</button>
        </div>`}
    `;
    box.appendChild(row);
  });
}
function toggleResetForm(id){
  const f = $('reset-'+id);
  const show = f.style.display !== 'flex';
  f.style.display = show ? 'flex' : 'none';
  if(!show) $('rp-'+id).value = '';
}
async function doReset(id){
  const pw = $('rp-'+id).value;
  if(!pw || pw.length < 6){ toast('新密码至少 6 位'); return; }
  try{
    await api('/api/admin/users/reset_password', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ user_id: id, new_password: pw }) });
    $('reset-'+id).style.display = 'none';
    toast('已重置，该用户需重新登录', true);
  }catch(e){ toast(e.message); }
}
async function toggleUser(id, disable){
  if(!confirm((disable ? '禁用' : '启用') + '该用户？')) return;
  try{
    await api('/api/admin/users/' + (disable ? 'disable' : 'enable'), { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ user_id: id }) });
    toast(disable ? '已禁用' : '已启用', true);
    loadAdmin();
  }catch(e){ toast(e.message); }
}
async function delUser(id){
  if(!confirm('删除该用户将清空其全部记账数据，且不可恢复。确定？')) return;
  try{
    await api('/api/admin/users?user_id=' + id, { method:'DELETE' });
    toast('已删除', true);
    loadAdmin();
  }catch(e){ toast(e.message); }
}
async function doAddUser(){
  const name = $('au-name').value.trim();
  const pass = $('au-pass').value;
  if(!name || name.length < 3 || name.length > 20){ toast('用户名需 3-20 个字符'); return; }
  if(!pass || pass.length < 6){ toast('初始密码至少 6 位'); return; }
  try{
    await api('/api/admin/users/create', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: name, password: pass }) });
    $('au-name').value=''; $('au-pass').value='';
    toast('已创建账户', true);
    loadAdmin();
  }catch(e){ toast(e.message); }
}

// ---- 场景分类组件（记账页）：场景下拉 → 二级子项 ----
const S = { categories: [], scene: null, sub: null };
function findCat(id, arr){
  if(arr === undefined) arr = S.categories;
  for(const n of arr){
    if(n.id === id) return n;
    const r = findCat(id, n.children);
    if(r) return r;
  }
  return null;
}
async function fetchCategories(){
  const j = await api('/api/categories');
  S.categories = j.data || [];
}
function renderSceneSelect(sceneId){
  const sel = $('scene-select');
  sel.innerHTML = '';
  S.categories.forEach(s=>{
    const o = document.createElement('option');
    o.value = s.id; o.textContent = s.name;
    sel.appendChild(o);
  });
  sel.value = sceneId || (S.categories[0] && S.categories[0].id) || '';
  if(sel.value) onSceneChange(parseInt(sel.value, 10));
}
function renderChips(box, items, activeId, onClick){
  box.innerHTML = '';
  items.forEach(n=>{
    const c = document.createElement('span');
    c.className = 'chip' + (n.id === activeId ? ' on' : '');
    c.textContent = n.name;
    c.addEventListener('click', ()=> onClick(n));
    box.appendChild(c);
  });
}
function onSceneChange(sceneId){
  const scene = findCat(sceneId);
  if(!scene) return;
  S.scene = scene; S.sub = null;
  renderChips($('sub-chips'), scene.children, null, onSubClick);
  if(scene.children.length){
    // 默认选中第一个二级子项
    onSubClick(scene.children[0]);
  } else {
    updateHint();
  }
}
function onSubClick(sub){
  S.sub = sub;
  renderChips($('sub-chips'), S.scene.children, sub.id, onSubClick);
  updateHint();
}
function updateHint(){
  const sel = S.sub
    ? (S.sub.name + (S.scene ? '（' + S.scene.name + '）' : ''))
    : (S.scene ? S.scene.name : '');
  $('sel-hint').textContent = '当前分类：' + sel;
}
// 场景下拉变更监听（一次性绑定，避免叠加）
$('scene-select').addEventListener('change', ()=> onSceneChange(parseInt($('scene-select').value, 10)));

// ---- 初始化 ----
(async function initAuth(){
  const u = currentUser();
  if(!localStorage.getItem('token') || !u){ showLogin(); return; }
  // 有凭证则立即进入主界面（避免刷新时闪登录页），后台校验有效性
  startApp();
  try{
    const me = await api('/api/auth/me');
    localStorage.setItem('user', JSON.stringify(me.data));
  }catch(e){
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    showLogin();
  }
})();
</script>
</body>
</html>
